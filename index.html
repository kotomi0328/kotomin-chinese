<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ことみんの中国語レッスン♡</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#513448;background:#fff7fb}body{margin:0 auto;max-width:690px;padding:22px 16px 100px}h1{font-size:25px;margin:0}p{line-height:1.6}.muted{color:#8a7182;font-size:13px}.panel,.phrase{background:white;border:1px solid #f2d7e6;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 3px 15px #f4d9e655}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px}.han{font-size:23px;font-weight:700}.pin{color:#b15f8d;margin-top:5px}.jp{font-size:14px;margin-top:6px;color:#756575}button,select{font:inherit;border-radius:13px;border:1px solid #e7bcd2;background:#fff7fb;padding:12px;color:#6d3154}button{cursor:pointer}button.primary{background:#d85495;color:white;border:0;font-weight:700}button:active{transform:scale(.98)}.play{min-width:76px}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:10px 0 5px;font-size:13px}select{width:100%;max-width:100%}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chips button.active{background:#d85495;color:white}#status{font-size:13px;color:#9b4676;min-height:22px}input{accent-color:#d85495}a{color:#a12e70}.notice{font-size:13px;color:#70586b;background:#fff0f6;border-radius:12px;padding:12px}.current{outline:2px solid #d85495}#list{margin-top:16px}</style><body><header><h1>🎀 ことみんの中国語レッスン♡</h1><p class="muted">タップして発音練習 ＆ 聞き流し｜第1〜4課</p></header><section class="panel"><strong>🎧 音声の設定</strong><label for="voice">中国語の声を選ぶ（先に試聴してね）</label><select id="voice"><option>音声を確認中…</option></select><div class="actions" style="margin-top:10px"><button id="test">🔊 この声を試す</button><button id="refresh">音声一覧を更新</button></div><label for="rate">再生速度 <span id="rateLabel">0.85</span>倍</label><input id="rate" type="range" min="0.65" max="1.15" step="0.05" value="0.85" style="width:100%"><div id="status" aria-live="polite"></div><p class="notice">このページ内の再生はiPhoneに入っている中国語の声を使います。Google翻訳と同じ声ではありません。気に入る声がなければ、各文の「Googleで聴く」を使ってね。中国語の声がない場合は日本語の声で代用しません。</p></section><section class="panel"><strong>💕 聞き流しモード</strong><p class="muted">第1課から順番に再生。文と文の間に練習時間を入れられるよ。</p><div class="actions"><button class="primary" id="start">▶ 聞き流し開始</button><button id="stop">■ 停止</button></div><label for="gap">真似する時間：<span id="gapLabel">3</span>秒</label><input id="gap" type="range" min="1" max="8" step="1" value="3" style="width:100%"><label><input type="checkbox" id="twice" checked> 同じ文を2回読む</label></section><section class="panel"><strong>📖 レッスンを選ぶ</strong><div id="filters" class="chips"></div></section><main id="list"></main><p class="muted">※音声の声調・品質は端末の音声エンジンに依存します。正確な発音確認には中国語ネイティブの音声教材も併用してね。</p><script>
const lessons=[
[1,'你好。','Nǐ hǎo.','こんにちは'],[1,'谢谢。','Xièxie.','ありがとう'],[1,'我想你了。','Wǒ xiǎng nǐ le.','会いたいな'],[1,'我喜欢你。','Wǒ xǐhuan nǐ.','好きだよ'],
[2,'你在做什么？','Nǐ zài zuò shénme?','何をしているの？'],[2,'我在学中文。','Wǒ zài xué Zhōngwén.','中国語を勉強しているよ'],[2,'我在跟你聊天。','Wǒ zài gēn nǐ liáotiān.','あなたとおしゃべりしているよ'],[2,'我在等你。','Wǒ zài děng nǐ.','あなたを待っているよ'],[2,'我在想你。','Wǒ zài xiǎng nǐ.','あなたのことを考えているよ'],
[3,'你在哪里？','Nǐ zài nǎlǐ?','どこにいるの？'],[3,'我在家。','Wǒ zài jiā.','家にいるよ'],[3,'我去找你。','Wǒ qù zhǎo nǐ.','あなたに会いに行くよ'],[3,'我快到了。','Wǒ kuài dào le.','もうすぐ着くよ'],[3,'等我一下。','Děng wǒ yíxià.','ちょっと待ってて'],[3,'我到了。','Wǒ dào le.','着いたよ'],
[4,'我喜欢这个。','Wǒ xǐhuan zhège.','これが好き'],[4,'我喜欢那个。','Wǒ xǐhuan nège.','あれが好き（作文練習）']];
let filter=0, voices=[], chosen=null, active=false, runId=0, timer=null;
const $=id=>document.getElementById(id), synth=window.speechSynthesis;
function status(s){$('status').textContent=s}
function voiceList(){if(!synth){status('この環境では音声読み上げを利用できません');return}voices=synth.getVoices().filter(v=>/^zh(?:-|_)/i.test(v.lang));let sel=$('voice'), previous=sel.value;sel.innerHTML='';if(!voices.length){sel.add(new Option('中国語の声が見つかりません',''));status('中国語の音声がありません。Googleで聴くを使ってね');return}voices.sort((a,b)=>{const rank=v=>/tingting|meijia|xiaoxiao|xiaoyi|huihui|female/i.test(v.name)?-2:0;return rank(a)-rank(b)});voices.forEach((v,i)=>sel.add(new Option(v.name+'（'+v.lang+'）',String(i))));if([...sel.options].some(o=>o.value===previous))sel.value=previous;status('声を選んで「この声を試す」を押してね')}
function selectedVoice(){return voices[Number($('voice').value)]||null}
function speak(text){return new Promise(resolve=>{if(!synth||!selectedVoice()){status('中国語の声を選べません。Googleで聴くを使ってね');resolve(false);return}let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(watch);resolve(ok)};synth.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.voice=selectedVoice();u.rate=Number($('rate').value);u.pitch=1.05;u.onend=()=>finish(true);u.onerror=()=>finish(false);let watch=setTimeout(()=>finish(false),16000);try{synth.speak(u)}catch(e){finish(false)}})}
function stop(){active=false;runId++;clearTimeout(timer);if(synth)synth.cancel();document.querySelectorAll('.phrase').forEach(e=>e.classList.remove('current'));status('停止しました')}
function wait(ms){return new Promise(resolve=>{timer=setTimeout(resolve,ms)})}
function google(text){return 'https://translate.google.com/?sl=zh-CN&tl=ja&text='+encodeURIComponent(text)+'&op=translate'}
function render(){let filters=$('filters');filters.innerHTML='';[0,1,2,3,4].forEach(n=>{let b=document.createElement('button');b.textContent=n?'第'+n+'課':'すべて';b.className=n===filter?'active':'';b.onclick=()=>{filter=n;render()};filters.append(b)});let list=$('list');list.innerHTML='';lessons.forEach((p,i)=>{if(filter&&p[0]!==filter)return;let el=document.createElement('article');el.className='phrase';el.id='phrase'+i;let content=document.createElement('div');content.style.flex='1';let heading=document.createElement('div');heading.className='muted';heading.textContent='第'+p[0]+'課';let han=document.createElement('div');han.className='han';han.textContent=p[1];let pin=document.createElement('div');pin.className='pin';pin.textContent=p[2];let jp=document.createElement('div');jp.className='jp';jp.textContent=p[3];content.append(heading,han,pin,jp);let controls=document.createElement('div');controls.style.display='flex';controls.style.flexDirection='column';controls.style.gap='7px';let play=document.createElement('button');play.className='primary play';play.textContent='🔊 聴く';play.onclick=async()=>{stop();status('再生中：'+p[1]);let ok=await speak(p[1]);if(!ok)status('再生できませんでした。別の声を選ぶかGoogleで聴いてね')};let link=document.createElement('a');link.href=google(p[1]);link.target='_blank';link.rel='noopener noreferrer';link.textContent='Googleで聴く';link.style.fontSize='12px';controls.append(play,link);el.append(content,controls);list.append(el)})}
$('test').onclick=async()=>{stop();status('声を試しています…');let ok=await speak('你好，我在学中文。');status(ok?'この声で練習できます':'再生できませんでした。別の声を選んでね')};$('refresh').onclick=voiceList;$('rate').oninput=()=>{$('rateLabel').textContent=$('rate').value};$('gap').oninput=()=>{$('gapLabel').textContent=$('gap').value};$('stop').onclick=stop;
$('start').onclick=async()=>{stop();if(!selectedVoice()){status('先に中国語の声を選んでね');return}active=true;let id=runId;let subset=lessons.map((p,i)=>({p,i})).filter(x=>!filter||x.p[0]===filter);for(const {p,i} of subset){if(!active||id!==runId)break;let el=$('phrase'+i);if(el){el.classList.add('current');el.scrollIntoView({behavior:'smooth',block:'center'})}for(let repeat=0;repeat<($('twice').checked?2:1);repeat++){if(!active||id!==runId)break;status('聞き流し中：'+p[1]);let ok=await speak(p[1]);if(!ok){status('音声が再生できませんでした。停止します');active=false;break}await wait(Number($('gap').value)*1000)}if(el)el.classList.remove('current')}if(active&&id===runId){active=false;status('聞き流しが終わったよ♡')}};
render();voiceList();if(synth){synth.addEventListener?.('voiceschanged',voiceList);setTimeout(voiceList,1000)}
</script></body></html>
